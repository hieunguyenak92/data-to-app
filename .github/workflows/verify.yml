name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python and parse browser scripts
        run: |
          python -m ruff check .
          node --check skills/data-to-app/assets/app/app.js
          node --check docs/demo/demo.js
      - name: Verify behavior
        run: python -m unittest discover -s tests -v
      - name: Verify documentation and generated artifacts
        run: |
          python tools/check_docs.py
          python tools/build_demo.py
          python tools/package_skill.py
          git diff --exit-code -- docs/demo/states.json
